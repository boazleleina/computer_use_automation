name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: checks (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject, and a current release. The floor is
        # the one that catches a 3.12-only idiom slipping in.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # The package alone is enough for mypy, which reads playwright's own
      # types. Running the live suite needs the browser binary as well, and
      # without it those tests error on launch rather than skipping: the
      # importorskip in the module only proves the library is importable.
      - name: Install the browser the live surface drives
        run: playwright install --with-deps chromium

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: mypy src target_app tests

      - name: Test
        run: pytest

      # The domain claims no third party dependency at all, and a suite passing
      # in the full dev environment proves nothing about that. This imports
      # every domain module into a virtualenv with nothing installed, not even
      # pytest, so anything reaching outside the standard library fails here.
      #
      # Checked by importing rather than by running tests: tests/unit also
      # covers adapters, which legitimately read YAML, and scoping the claim to
      # whichever tests happen to live in a directory is not the claim.
      - name: Domain imports nothing but the standard library
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/python - <<'CHECK'
          import importlib, pkgutil, sys
          sys.path.insert(0, "src")
          import cua.domain

          failures = []
          for module in pkgutil.walk_packages(cua.domain.__path__, "cua.domain."):
              try:
                  importlib.import_module(module.name)
              except Exception as error:
                  failures.append(f"{module.name}: {error}")

          for failure in failures:
              print(f"  {failure}")
          print(f"{'FAILED' if failures else 'ok'}: domain modules importable with nothing installed")
          sys.exit(1 if failures else 0)
          CHECK
