name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: checks (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject, and a current release. The floor is
        # the one that catches a 3.12-only idiom slipping in.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: mypy src target_app tests

      - name: Test
        run: pytest

      # The domain claims no third party dependency at all. Installing nothing
      # but pytest and running the suite is the only way to keep that honest;
      # a passing suite in the full dev environment proves nothing about it.
      - name: Domain suite with no dependencies installed
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/pip install --quiet pytest
          PYTHONPATH=src:. /tmp/bare/bin/pytest tests/unit -q -p no:cacheprovider
